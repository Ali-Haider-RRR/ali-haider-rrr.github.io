<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LydraCare</title>
<style>
  :root { color-scheme: light dark; --bg:#F8F5EE; --fg:#1b1b18; --brand:#6B7D5E; --card:#ffffff; --muted:#6c6f66; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --fg:#f2f2ee; --card:#262522; --muted:#a4a79f; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
         background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { width:100%; max-width:440px; background:var(--card); border-radius:24px; padding:28px 22px; text-align:center;
         box-shadow:0 6px 24px rgba(0,0,0,.08); }
  h1 { margin:0 0 10px; font-size:26px; color:var(--brand); }
  p { margin:0; line-height:1.5; color:var(--muted); font-size:18px; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p id="body"></p>
</main>
<script>
  // Stripe sends the caregiver here after Checkout / the billing portal (?status=success|cancel|portal).
  // The app refreshes its plan by itself when the caregiver switches back to it.
  var TEXT = {
    en: { success: ["Payment received", "Thank you! Go back to the LydraCare app — your plan is being activated."],
          cancel:  ["Payment cancelled", "No charge was made. Go back to the LydraCare app whenever you are ready."],
          portal:  ["All set", "Your changes are saved. Go back to the LydraCare app."] },
    es: { success: ["Pago recibido", "¡Gracias! Vuelve a la app LydraCare: tu plan se está activando."],
          cancel:  ["Pago cancelado", "No se hizo ningún cargo. Vuelve a la app LydraCare cuando quieras."],
          portal:  ["Listo", "Tus cambios se guardaron. Vuelve a la app LydraCare."] },
    fr: { success: ["Paiement reçu", "Merci ! Retournez dans l'application LydraCare — votre offre est en cours d'activation."],
          cancel:  ["Paiement annulé", "Aucun montant n'a été débité. Retournez dans l'application LydraCare quand vous voulez."],
          portal:  ["C'est fait", "Vos modifications sont enregistrées. Retournez dans l'application LydraCare."] }
  };
  var lang = (navigator.language || "en").slice(0, 2);
  if (!TEXT[lang]) lang = "en";
  document.documentElement.lang = lang;
  var status = new URLSearchParams(location.search).get("status");
  if (!TEXT[lang][status]) status = "success";
  document.getElementById("title").textContent = TEXT[lang][status][0];
  document.getElementById("body").textContent = TEXT[lang][status][1];
</script>
</body>
</html>
