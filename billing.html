<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LydraCare</title>
<style>
  :root { color-scheme: light dark; --bg:#F8F5EE; --fg:#1b1b18; --brand:#6B7D5E; --card:#ffffff; --muted:#6c6f66; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --fg:#f2f2ee; --card:#262522; --muted:#a4a79f; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
         background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { width:100%; max-width:440px; background:var(--card); border-radius:24px; padding:28px 22px; text-align:center;
         box-shadow:0 6px 24px rgba(0,0,0,.08); }
  h1 { margin:0 0 10px; font-size:26px; color:var(--brand); }
  p { margin:0 0 22px; line-height:1.5; color:var(--muted); font-size:18px; }
  a.btn { display:block; padding:18px 16px; border-radius:16px; font-size:20px; font-weight:700;
          text-decoration:none; background:var(--brand); color:#fff; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p id="body"></p>
  <a id="open" class="btn" href="#"></a>
</main>
<script>
  // Stripe sends the caregiver here after Checkout / the billing portal (?status=success|cancel|portal).
  // This page hands them straight back to the LydraCare app (lydracare://billing) — automatically, and via the
  // big button if the browser blocks the automatic jump. The app then shows "<Plan> plan activated".
  var TEXT = {
    en: { open: "Open LydraCare",
          success: ["Payment received", "Thank you! Taking you back to LydraCare…"],
          cancel:  ["Payment cancelled", "No charge was made. Taking you back to LydraCare…"],
          portal:  ["All set", "Your changes are saved. Taking you back to LydraCare…"] },
    es: { open: "Abrir LydraCare",
          success: ["Pago recibido", "¡Gracias! Te llevamos de vuelta a LydraCare…"],
          cancel:  ["Pago cancelado", "No se hizo ningún cargo. Te llevamos de vuelta a LydraCare…"],
          portal:  ["Listo", "Tus cambios se guardaron. Te llevamos de vuelta a LydraCare…"] },
    fr: { open: "Ouvrir LydraCare",
          success: ["Paiement reçu", "Merci ! Retour vers LydraCare…"],
          cancel:  ["Paiement annulé", "Aucun montant n'a été débité. Retour vers LydraCare…"],
          portal:  ["C'est fait", "Vos modifications sont enregistrées. Retour vers LydraCare…"] }
  };
  var lang = (navigator.language || "en").slice(0, 2);
  if (!TEXT[lang]) lang = "en";
  document.documentElement.lang = lang;

  var status = new URLSearchParams(location.search).get("status");
  if (!TEXT[lang][status]) status = "success";
  document.getElementById("title").textContent = TEXT[lang][status][0];
  document.getElementById("body").textContent = TEXT[lang][status][1];

  var query = "?status=" + encodeURIComponent(status);
  var isAndroid = /android/i.test(navigator.userAgent);
  // Android Chrome: an intent:// link opens the app reliably; elsewhere the plain custom scheme.
  var appUrl = isAndroid
    ? "intent://billing" + query + "#Intent;scheme=lydracare;package=com.lydracare.app;end"
    : "lydracare://billing" + query;

  var button = document.getElementById("open");
  button.textContent = TEXT[lang].open;
  button.href = appUrl;

  // Automatic jump back to the app (the button above is the fallback).
  setTimeout(function () { location.href = appUrl; }, 500);
</script>
</body>
</html>
